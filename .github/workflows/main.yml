name: Android Kernel Driver Builder

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version (Kernel KMI)'
        required: true
        type: choice
        options:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ github.event.inputs.android_version }}-20260313
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Prepare kerneldriver directory
        run: |
          mkdir kerneldriver
          find ./code -maxdepth 1 \( -name "*.h" -o -name "*.c" -o -name "Makefile" \) -exec cp {} kerneldriver/ \;

      - name: Auto-detect driver module name
        id: detect_module
        run: |
          cd kerneldriver
          MODULE_OBJ=$(grep -E '^obj-[my]\s*[:+]?=' Makefile | head -n1 | awk '{print $3}' | sed 's/\.o$/.ko/')
          if [ -z "$MODULE_OBJ" ]; then
            echo "Error: Cannot find 'obj-m' or 'obj-y' in Makefile" >&2
            exit 1
          fi
          echo "Detected module: $MODULE_OBJ"
          echo "module_name=$MODULE_OBJ" >> $GITHUB_OUTPUT

      - name: Build kernel module
        run: |
          cd kerneldriver
          make -C $KERNEL_SRC M=$PWD modules -j$(nproc)

      - name: Stage driver artifacts
        run: |
          mkdir -p upload_artifact
          TARGET_MODULE="${{ steps.detect_module.outputs.module_name }}"
          MODULE_FILE="kerneldriver/$TARGET_MODULE"

          if [ ! -f "$MODULE_FILE" ]; then
            echo "❌ Module not found: $MODULE_FILE"
            ls -la kerneldriver/
            exit 1
          fi

          cp "$MODULE_FILE" upload_artifact/
          echo "📦 Staged files:"
          ls -lh upload_artifact/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kernel-driver-${{ github.event.inputs.android_version }}
          path: upload_artifact/
          if-no-files-found: error
